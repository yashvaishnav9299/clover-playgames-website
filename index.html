              <path d="M20 16.5V7.2" stroke="#A6FFC7" stroke-opacity="0.35" stroke-width="1.1" stroke-linecap="round"/>

        <a href="contact.html">Get in Touch</a>
        <span class="footer-sep" aria-hidden="true">•</span>
        <a href="mailto:info@cloverplaygames.com" class="footer-email">info@cloverplaygames.com</a>
      </nav>

  <script>
    const instagramButton = document.querySelector('.icon-btn');
    if (instagramButton) {
      instagramButton.addEventListener('click', () => {
        instagramButton.classList.remove('is-pressed');
        void instagramButton.offsetWidth;
        instagramButton.classList.add('is-pressed');
      });
    }
  </script>
